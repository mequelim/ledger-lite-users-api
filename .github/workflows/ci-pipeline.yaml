name: Continuous Integration Pipeline

on:
  push:
    branches: [ "master", "homol", "development" ]
  pull_request:
    branches: [ "master", "homol", "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/LedgerLiteUsersAPI/LedgerLiteUsersAPI.slnx

    - name: Build
      run: dotnet build src/LedgerLiteUsersAPI/LedgerLiteUsersAPI.slnx --no-restore --configuration Release

    - name: Test
      run: |
        dotnet run --project src/LedgerLiteUsersAPI/Users.Application.Tests/Users.Application.Tests.csproj --no-build --configuration Release
        dotnet run --project src/LedgerLiteUsersAPI/Users.Domain.Tests/Users.Domain.Tests.csproj --no-build --configuration Release
        dotnet run --project src/LedgerLiteUsersAPI/Users.Persistence.Tests/Users.Persistence.Tests.csproj --no-build --configuration Release
        dotnet run --project src/LedgerLiteUsersAPI/Users.WebAPI.Tests/Users.WebAPI.Tests.csproj --no-build --configuration Release

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)